<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Draws - Partna</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script defer src="app.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 shadow-lg rounded-lg w-96">
        <h2 class="text-2xl font-bold text-center mb-4">Create a Partner Draw</h2>
        <input type="text" id="drawName" placeholder="Draw Name" class="w-full p-3 border rounded-md mb-3">
        <input type="number" id="contribution" placeholder="Contribution Amount" class="w-full p-3 border rounded-md mb-3">
        <button onclick="createDraw()" class="w-full bg-blue-600 text-white p-3 rounded-md shadow-md hover:bg-blue-500">
            Create Draw
        </button>
        <p id="drawResult" class="text-center text-sm text-gray-600 mt-2"></p>
    </div>
</body>
</html>
